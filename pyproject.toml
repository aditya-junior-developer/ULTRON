[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ultron-local-agent"
version = "1.0.0"
description = "ULTRON authenticated local assistant and automation agent"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic>=2.10,<3", "psutil>=6,<8", "keyring>=25,<26", "jsonschema>=4.23,<5",
  "google-auth-oauthlib>=1.2,<2", "google-api-python-client>=2.160,<3",
]

[project.optional-dependencies]
voice = ["faster-whisper>=1.2,<2", "sounddevice>=0.5,<1", "numpy>=2,<3", "piper-tts>=1.3,<2", "openwakeword>=0.6,<1; platform_system == 'Windows'"]
automation = ["playwright>=1.50,<2", "mss>=10,<11", "pyautogui>=0.9.54,<1", "screen-brightness-control>=0.24,<1", "pywin32>=308; sys_platform == 'win32'", "pycaw>=20240210; sys_platform == 'win32'"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]
packaging = ["pyinstaller>=6.12,<7"]

[project.scripts]
ultron-agent = "ultron.__main__:main"

[tool.setuptools.packages.find]
where = ["services/local-agent"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv]
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]
