name: Verify ULTRON
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ultron-verification
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install uv==0.12.24
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev pytest -q
      - run: uv run --frozen --extra dev ruff check services/local-agent tests/python
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node --test tests/database.test.mjs
      - run: npm run build
      - run: npm run build -w @ultron/cloud-worker
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install uv==0.12.24
      - run: uv sync --frozen --all-extras
      - run: uv run --frozen --all-extras pytest -q
      - run: npm ci
      - run: npx --no install-electron --no
      - run: npm run build
      - run: node tests/e2e/electron.mjs
      - run: uv run --frozen --all-extras python scripts/build-agent.py
      - run: npm run package:win
      - run: python scripts/release-manifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: ultron-windows-review
          path: apps/desktop/release/*.exe
          retention-days: 3
# Manual only. Check remaining included minutes and disable paid overages in GitHub billing.
# No releases are published, no cloud deployments occur, and no DB migrations run.
